
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غسيل كلاود - ghasil.cloud | المنظومة السحابية الذكية لإدارة المغاسل</title>
    <meta name="description" content="نظام سحابي ذكي متكامل لإدارة المغاسل والمصابغ ومغاسل السيارات - فواتير معتمدة، باركود ملابس، إشعارات واتساب، وأوفلاين 100%.">
    <meta name="theme-color" content="#060c1d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ghasil.cloud">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
            color: #111827;
            margin: 0;
            padding: 0;
        }

        /* Prevent browsers from forcing dark mode on inputs */
        input, select, textarea {
            background-color: white !important;
            color: #111827 !important;
        }

        /* Refined Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar,
        .print-modal-card::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track,
        .print-modal-card::-webkit-scrollbar-track {
            background: transparent;
            margin: 14px 0;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb,
        .print-modal-card::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
            transition: background 0.2s ease;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover,
        .print-modal-card::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .custom-scrollbar,
        .print-modal-card {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        /* Print Logic */
        .print-only {
            display: none !important;
        }
        @media print {
            @page {
                margin: 0 !important;
                size: auto;
            }

            html, body {
                width: 100% !important;
                height: auto !important;
                min-height: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
                color: black !important;
                overflow: visible !important;
            }

            /* CRITICAL: Remove all main layout elements from document flow so they do not create an empty page 1 */
            #root > *:not(.print-modal-overlay),
            .no-print,
            header, nav, aside,
            #pdf-invoice-wrapper-outer,
            #pdf-invoice-container,
            .pdf-invoice-export-container {
                display: none !important;
            }

            body * {
                visibility: hidden;
            }

            .print-modal-overlay {
                position: static !important;
                display: block !important;
                background: transparent !important;
                padding: 0 !important;
                margin: 0 !important;
                overflow: visible !important;
                inset: auto !important;
                box-shadow: none !important;
                border: none !important;
                width: 100% !important;
                height: auto !important;
                min-height: 0 !important;
            }

            .print-modal-card {
                position: static !important;
                display: block !important;
                background: transparent !important;
                padding: 0 !important;
                margin: 0 !important;
                max-height: none !important;
                height: auto !important;
                min-height: 0 !important;
                overflow: visible !important;
                box-shadow: none !important;
                border: none !important;
                width: 100% !important;
                max-width: none !important;
            }

            .print-modal-card > div,
            .print-modal-card .overflow-y-auto {
                overflow: visible !important;
                height: auto !important;
                max-height: none !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            #print-area, #print-area * {
                visibility: visible !important;
                background-color: white !important;
                color: black !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            #print-area {
                display: block !important;
                position: relative !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                max-width: 80mm !important;
                margin: 0 auto !important;
                padding: 2mm 3mm !important;
                background: white !important;
                box-shadow: none !important;
                border: none !important;
                font-family: 'Tajawal', sans-serif !important;
                page-break-before: avoid !important;
                page-break-after: avoid !important;
                break-before: avoid !important;
                break-after: avoid !important;
            }

            .print-only {
                display: block !important;
                visibility: visible !important;
            }
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
